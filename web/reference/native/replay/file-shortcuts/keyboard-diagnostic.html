<!doctype html><meta charset="utf-8"><title>Gelbox keyboard diagnostic</title><button id="focus">Focus test surface</button><pre id="events">Waiting for keys</pre><script>
let rows=[];window.addEventListener('keydown',e=>{e.preventDefault();rows.push(JSON.stringify({key:e.key,code:e.code,meta:e.metaKey,alt:e.altKey,ctrl:e.ctrlKey,cancelable:e.cancelable,prevented:e.defaultPrevented}));document.querySelector('#events').textContent=rows.join('\n');},true);
</script>
