name: web

on:
  push:
    branches: [main, master]
  pull_request:

# A newer push to the same ref supersedes a run still in progress.
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: web/ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/ts/.nvmrc
          cache: 'npm'
          cache-dependency-path: web/ts/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npx playwright install --with-deps chromium
      - name: Install Vulkan loader for WebGPU
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers vulkan-tools
          # Verify: vulkaninfo --summary should list at least one device
          vulkaninfo --summary || true
      - name: Locate SwiftShader Vulkan ICD
        run: |
          ICD=$(find ~/.cache/ms-playwright -name 'vk_swiftshader_icd.json' 2>/dev/null | head -1)
          if [ -z "$ICD" ]; then
            echo "WARNING: vk_swiftshader_icd.json not found under ms-playwright cache"
            ls -la ~/.cache/ms-playwright/ || true
            exit 0
          fi
          echo "Found SwiftShader Vulkan ICD at: $ICD"
          echo "VK_ICD_FILENAMES=$ICD" >> $GITHUB_ENV
      # Linux has no WebGPU adapter (even with mesa-vulkan-drivers + the
      # SwiftShader ICD) and renders WebGL2 in software, so CI runs only the
      # chromium-webgl2 project minus the specs listed in
      # tests/visual/linuxCiScope.ts. The full suite runs locally on macOS.
      - run: npm run test:visual
        env:
          GEL_VISUAL_SCOPE: linux-ci
      # Failure screenshots, and the trace recorded on a test's retry.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: web/ts/test-results/
          retention-days: 7
          if-no-files-found: ignore
      - run: npm run build
